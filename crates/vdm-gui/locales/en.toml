# Vibe Download Manager: English strings (the source for every other language).
#
# Notes for translators:
# - Keep {placeholders} exactly as they are; the app fills them in.
#   In settings.after_download_placeholder, {path} is literal text the user types.
# - "Vibe" and "Vibe Download Manager" are the product name: don't translate them.
# - Keep strings short: most are button labels or column headers.
# - Use the typographic ellipsis "…" where the English has one.

