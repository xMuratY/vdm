# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates fail the check only when we depend on them directly; the
# ones deep inside iced and the tray (paste, rustybuzz, ...) have no replacement yet.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
